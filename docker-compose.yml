#
# Local development stack for OpenSalesTax. Two database profiles are
# defined; activate one at a time:
#
#   docker compose --profile postgres up
#   docker compose --profile mariadb up
#
# Without a profile flag, only the API is brought up (you'd need to point
# OPENSALESTAX_DATABASE_URL at an existing database).
#
# After the database is ready, run migrations against it:
#
#   docker compose run --rm api alembic upgrade head

services:
  api:
    build: .
    image: opensalestax:dev
    ports:
      - "8080:8080"
    environment:
      OPENSALESTAX_DATABASE_URL: ${OPENSALESTAX_DATABASE_URL:-postgresql+asyncpg://opensalestax:opensalestax@postgres:5432/opensalestax}
      OPENSALESTAX_LOG_LEVEL: ${OPENSALESTAX_LOG_LEVEL:-INFO}
      OPENSALESTAX_RATE_LIMIT_PER_MINUTE: ${OPENSALESTAX_RATE_LIMIT_PER_MINUTE:-60}
      # Set to "true" only when this stack sits behind a trusted proxy
      # (Cloudflare, internal LB) that always rewrites CF-Connecting-IP
      # or X-Forwarded-For. Default false; trusting these headers
      # without a proxy lets any caller spoof their IP and bypass the
      # per-IP rate limit.
      OPENSALESTAX_TRUST_FORWARDED_FOR: ${OPENSALESTAX_TRUST_FORWARDED_FOR:-false}
      OPENSALESTAX_DATA_DIR: ${OPENSALESTAX_DATA_DIR:-/var/lib/opensalestax/data}
    volumes:
      # Persist the SST quarterly cache + Census ZCTA crosswalk so
      # `data load-zcta` and `data load --state X` don't re-fetch
      # multi-megabyte files on every container rebuild. The host
      # path is created by the compose stack on first up; remove it
      # to force a clean re-fetch.
      - opensalestax_data:/var/lib/opensalestax/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mariadb:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:15
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: opensalestax
      # Overridable so a real deployment can set a genuine secret in its
      # gitignored .env. The literal default is a convenience for local
      # development ONLY, and is safe there only because the port below is
      # bound to loopback.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensalestax}
      POSTGRES_DB: opensalestax
    ports:
      # LOOPBACK ONLY -- do not change to "5432:5432".
      #
      # The api service reaches Postgres over the compose network as
      # `postgres:5432`; it does not use this mapping at all. The mapping
      # exists solely so a developer can point host-side tools (pytest with
      # OPENSALESTAX_DATABASE_URL, psql, a GUI client) at localhost.
      #
      # Published on 0.0.0.0 this exposed the production database to every
      # host on the LAN, with a password identical to the username. Found
      # 2026-09-09; see specs/findings/db-exposed-on-lan-2026-09.md. To reach
      # a remote deployment's database, tunnel instead:
      #   ssh -L 5432:localhost:5432 <host>
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensalestax"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    profiles: ["mariadb"]
    environment:
      MARIADB_USER: opensalestax
      # See the postgres service: literal defaults are for local development
      # only; a real deployment sets these in its gitignored .env.
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-opensalestax}
      MARIADB_DATABASE: opensalestax
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpw}
    ports:
      # Loopback only -- same reasoning as the postgres service above.
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  mariadb_data:
  opensalestax_data:
